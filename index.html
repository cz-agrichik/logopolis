<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Λόγος · Кипр сквозь эпохи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/desktop/styles.css?v=17">
</head>
<body data-epoch="0">
  <header id="topbar">
    <div class="brand">
      <div class="logo">Λόγος</div>
      <div>
        <div class="epoch-name" id="epochName"></div>
        <div class="epoch-sub" id="epochSub"></div>
      </div>
    </div>
    <div class="logos-medal" id="logosMedal" title="Логос — главный ресурс: его дают только карточки"></div>
    <div class="resbar" id="resources"></div>
    <div class="popbox" id="popbox"></div>
    <button id="pediaBtn" class="pedia-btn" title="Кипропедия — справочник по игре и учёбе (F1)">📖</button>
    <button id="schoolBtn" class="pedia-btn" title="Обучение: прогресс по словам, колоды, темп, экспорт">📚</button>
    <button id="studyBtn" class="study-btn"><span class="sb-main">📜 Учиться</span><span class="sb-sub" id="studySub"></span></button>
  </header>

  <main>
    <section id="mapWrap">
      <div id="buffbar" class="buffbar hidden"></div>
      <div id="map"></div>
      <div id="placeHint" class="place-hint hidden"></div>
      <footer id="log"></footer>
    </section>
    <aside id="side">
      <nav class="tabs">
        <button data-tab="build" class="active">Строить</button>
        <button data-tab="tech">Знания</button>
        <button data-tab="rites">Обряды</button>
        <button data-tab="epoch">Эпоха</button>
      </nav>
      <div id="panel"></div>
    </aside>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <div id="pedia" class="pedia hidden">
    <div class="pedia-box">
      <div class="pedia-top"><div class="pedia-title">📖 Кипропедия <small>Κυπροπαίδεια</small></div><button class="st-close" data-pedia-close title="Закрыть (Esc)">✕</button></div>
      <div class="pedia-main"><nav id="pediaNav" class="pedia-nav"></nav><article id="pediaBody" class="pedia-body"></article></div>
    </div>
  </div>

  <div id="school" class="pedia school hidden">
    <div class="pedia-box">
      <div class="pedia-top"><div class="pedia-title">📚 Обучение <small>Παιδεία</small></div><button class="st-close" data-school-close title="Закрыть (Esc)">✕</button></div>
      <div class="pedia-main"><nav id="schoolNav" class="pedia-nav"></nav><article id="schoolBody" class="pedia-body"></article></div>
    </div>
  </div>

  <div id="study" class="study hidden">
    <div class="st-box">
      <div class="st-head">
        <button class="st-close" id="stClose" title="Закрыть (Esc)">✕</button>
        <div class="st-bar"><i id="stProgress"></i></div>
        <div class="st-meta"><span id="stCombo"></span><span id="stEarned" class="st-earned">λ +0</span></div>
      </div>
      <div class="st-bonus" id="stBonus"></div>
      <div id="stBody" class="st-body"></div>
    </div>
  </div>

  <!-- Ядро: чистая логика, без страницы и без текстов -->
  <script src="core/util.js?v=17"></script>
  <script src="core/defs.js?v=17"></script>
  <script src="core/learning/greek.js?v=17"></script>
  <script src="core/learning/decks.js?v=17"></script>
  <script src="core/learning/srs.js?v=17"></script>
  <script src="core/learning/lesson.js?v=17"></script>
  <script src="core/learning/journal.js?v=17"></script>
  <script src="core/learning/learn.js?v=17"></script>
  <script src="core/city/state.js?v=17"></script>
  <script src="core/city/economy.js?v=17"></script>
  <script src="core/city/build.js?v=17"></script>
  <script src="core/city/research.js?v=17"></script>
  <script src="core/city/rituals.js?v=17"></script>
  <script src="core/city/epochs.js?v=17"></script>
  <script src="core/city/world.js?v=17"></script>
  <script src="core/session.js?v=17"></script>
  <!-- Тексты (русский): названия, сообщения, справка, встроенные колоды -->
  <script src="content/ru/words.js?v=17"></script>
  <script src="content/ru/lexicon.js?v=17"></script>
  <script src="content/ru/messages.js?v=17"></script>
  <!-- Графика и платформа -->
  <script src="assets/art.js?v=17"></script>
  <script src="platform/browser.js?v=17"></script>
  <!-- Общее для HTML-интерфейсов -->
  <script src="ui/common/format.js?v=17"></script>
  <script src="ui/common/looks.js?v=17"></script>
  <script src="ui/common/catalog.js?v=17"></script>
  <script src="content/ru/pedia.js?v=17"></script>
  <!-- Интерфейс для компьютера -->
  <script src="ui/desktop/ui.js?v=17"></script>
  <script src="ui/desktop/study.js?v=17"></script>
  <script src="ui/desktop/pedia.js?v=17"></script>
  <script src="ui/desktop/school.js?v=17"></script>
  <script src="ui/desktop/main.js?v=17"></script>
</body>
</html>
